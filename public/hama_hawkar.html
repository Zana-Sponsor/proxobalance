<!DOCTYPE html><html dir="rtl" lang="ku"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#232B45">
<title>حەمە و هاوکار</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap">
<style>
/* ── فۆنت: Bahij TheSansArabic بۆ هەموو پیتەکان (کوردی + لاتینی)
   ⚠ ئەگەر ڕێچکەی ریپۆکەت جیاوازە تەنها ئەم دوو URLـە بگۆڕە */
@font-face{font-family:'B';src:url('https://raw.githubusercontent.com/Zana-Sponsor/Zana-Sponsor/main/Bahij_TheSansArabic-Regular.ttf') format('truetype');font-weight:400;font-style:normal;font-display:swap;}
@font-face{font-family:'B';src:url('https://raw.githubusercontent.com/Zana-Sponsor/Zana-Sponsor/main/Bahij_TheSansArabic-ExtraBold.ttf') format('truetype');font-weight:700 900;font-style:normal;font-display:swap;}

:root{
  --page:#232B45;
  --ink:#FFFFFF;
  --muted:#98A1BE;
  --card:#2C3454;
  --line:rgba(255,255,255,.13);
  --accent:#8FA4E8;
  --glass:rgba(255,255,255,.07);
  --glass-line:rgba(255,255,255,.14);
  --ease-out:cubic-bezier(.22,1,.36,1);
  --pad:26px;
}

*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;
  -webkit-user-select:none;-moz-user-select:none;-ms-user-select:none;user-select:none;
  -webkit-touch-callout:none;}
img{-webkit-user-drag:none;user-drag:none;-webkit-touch-callout:none;}

body{font-family:'B',system-ui,-apple-system,sans-serif;background:#232B45;min-height:100vh;display:flex;justify-content:center;}
.wrap{width:100%;max-width:430px;min-height:100vh;display:flex;flex-direction:column;position:relative;overflow:hidden;
  background:linear-gradient(180deg,#2C3552 0%,#252D49 52%,#1F2740 100%);}

.aura{position:absolute;top:-160px;left:50%;transform:translateX(-50%);width:420px;height:420px;border-radius:50%;pointer-events:none;
  background:radial-gradient(circle,rgba(140,170,255,.16) 0%,rgba(140,170,255,.06) 45%,transparent 70%);
  animation:breathe 7s ease-in-out infinite;}
@keyframes breathe{0%,100%{transform:translateX(-50%) scale(1);opacity:.9}50%{transform:translateX(-50%) scale(1.1);opacity:1}}

/* ── پرۆفایل ── */
.av-wrap{display:flex;justify-content:center;padding-top:calc(66px + env(safe-area-inset-top));margin-bottom:22px;position:relative;z-index:1;}
.av{width:88px;height:88px;border-radius:50%;border:4px solid rgba(255,255,255,.15);overflow:hidden;background:linear-gradient(150deg,#7C8BE8,#4F5FBF);display:flex;align-items:center;justify-content:center;color:#fff;box-shadow:0 14px 30px -12px rgba(0,0,0,.6),0 0 0 7px rgba(255,255,255,.05);}
.av img{width:100%;height:100%;object-fit:cover;display:block;}
.profile{padding:0 var(--pad);text-align:center;margin-bottom:34px;position:relative;z-index:1;}
.uname{font-family:'Inter',system-ui,-apple-system,sans-serif;font-size:20px;font-weight:700;letter-spacing:-.25px;color:var(--ink);margin-bottom:10px;}
.ubio{font-size:14.5px;color:var(--muted);line-height:1.8;white-space:pre-line;max-width:300px;margin:0 auto;}

/* ── دووگمەکان ── */
.btns{margin:0 var(--pad);padding:0;display:flex;flex-direction:column;gap:16px;position:relative;z-index:1;}
.pl-btn{
  display:flex;align-items:center;width:100%;padding:19px 20px;border:1px solid var(--glass-line);border-radius:50px;
  background:var(--glass);color:#fff;text-decoration:none;cursor:pointer;font-family:inherit;
  position:relative;overflow:hidden;
  box-shadow:0 10px 24px -14px rgba(0,0,0,.75),inset 0 1px 0 rgba(255,255,255,.1);
  transition:transform .4s var(--ease-out),background .3s ease,border-color .3s ease;
  will-change:transform;
}
.pl-btn:active{transform:scale(.972);background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.2);}
.pl-btn:focus-visible{outline:3px solid rgba(143,164,232,.6);outline-offset:3px;}
.pl-lbl{flex:1;text-align:center;font-size:17.5px;font-weight:400;line-height:1.45;letter-spacing:.1px;}
.pl-ic{width:42px;flex-shrink:0;text-align:center;opacity:.9;}
.pl-sp{width:42px;flex-shrink:0;}

.rise{opacity:0;transform:translateY(14px);animation:rise .7s cubic-bezier(.22,1,.36,1) forwards;}
@keyframes rise{to{opacity:1;transform:translateY(0)}}

.rip{position:absolute;border-radius:50%;background:rgba(255,255,255,.16);transform:scale(0);opacity:.75;pointer-events:none;animation:rip .95s cubic-bezier(.25,.8,.35,1) forwards;}
@keyframes rip{to{transform:scale(2.6);opacity:0}}

.shine::after{content:'';position:absolute;top:0;left:-60%;width:45%;height:100%;
  background:linear-gradient(to right,transparent,rgba(255,255,255,.09),transparent);
  transform:skewX(-20deg);animation:sh 3s ease-in-out infinite;pointer-events:none;}
@keyframes sh{0%{left:-60%}55%,100%{left:170%}}
.no-sh::after{display:none;}

/* ── تیک‌تۆک ── */
.tt-wrap{display:flex;justify-content:center;margin:30px var(--pad) 0;position:relative;z-index:1;}
.tt-sm{display:inline-flex;align-items:center;gap:7px;padding:10px 22px;border-radius:50px;
  background:rgba(255,255,255,.08);border:1px solid var(--glass-line);color:#fff;text-decoration:none;font-size:14.5px;font-weight:400;
  transition:transform .4s var(--ease-out),background .3s ease;}
.tt-sm:active{transform:scale(.965);background:rgba(255,255,255,.14);}
.tt-sm span{font-family:system-ui,-apple-system,sans-serif;font-weight:400;}
.tt-sm i{font-size:18px;}

/* ── جیاکەرەوە + پێ ── */
.bottom{margin-top:auto;position:relative;z-index:1;}
.divider{height:1px;margin:46px 36px 0;background:linear-gradient(to left,transparent,var(--line) 20%,var(--line) 80%,transparent);}
.footer{width:100%;padding:30px 20px calc(26px + env(safe-area-inset-bottom));text-align:center;}
.footer small{display:block;font-size:12px;color:#8A93B2;margin-bottom:6px;font-weight:400;}
.footer img{height:15px;display:block;margin:0 auto 10px;opacity:.9;filter:brightness(0) invert(1);}
.legal{font-size:11px;color:#8A93B2;}
.legal a{color:inherit;text-decoration:none;margin:0 5px;}

/* ── دیالۆگی ناوەڕاستی شاشە ── */
.sheet-wrap{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;padding:26px;
  visibility:hidden;transition:visibility 0s .4s;}
.sheet-wrap.open{visibility:visible;transition-delay:0s;}
.scrim{position:absolute;inset:0;background:rgba(10,14,28,.62);-webkit-backdrop-filter:blur(5px);backdrop-filter:blur(5px);opacity:0;transition:opacity .38s ease;}
.sheet-wrap.open .scrim{opacity:1;}

.sheet{position:relative;width:100%;max-width:366px;background:var(--card);
  border-radius:34px;padding:28px 22px 18px;text-align:center;
  border:1px solid rgba(255,255,255,.09);
  box-shadow:0 26px 54px -18px rgba(0,0,0,.7);
  opacity:0;transform:translateY(16px) scale(.95);
  transition:opacity .34s var(--ease-out),transform .44s var(--ease-out);
  will-change:transform;}
.sheet-wrap.open .sheet{opacity:1;transform:translateY(0) scale(1);}

.s-ttl{font-size:20px;font-weight:400;letter-spacing:-.2px;color:var(--ink);margin-bottom:8px;}
.s-txt{font-size:14px;font-weight:400;color:var(--muted);line-height:1.8;max-width:258px;margin:0 auto 20px;}

/* هەڵبژاردنی مەبەست */
.opts{display:flex;flex-direction:column;gap:10px;margin-bottom:6px;
  max-height:56vh;overflow-y:auto;-webkit-overflow-scrolling:touch;}
.opts::-webkit-scrollbar{width:0;height:0;}
.opt{width:100%;padding:12px 14px;border:0;border-radius:20px;
  background:rgba(255,255,255,.06);color:var(--ink);font-family:inherit;font-size:15px;font-weight:400;
  text-align:right;cursor:pointer;display:flex;align-items:center;gap:12px;
  position:relative;overflow:hidden;
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.1);
  transition:transform .4s var(--ease-out),background .25s;}
.opt:active{transform:scale(.972);background:rgba(255,255,255,.12);}
.opt:focus-visible{outline:3px solid rgba(143,164,232,.6);outline-offset:2px;}
.opt-ico{width:40px;height:40px;border-radius:14px;flex-shrink:0;font-size:18px;
  background:linear-gradient(150deg,rgba(255,255,255,.14),rgba(255,255,255,.06));
  display:flex;align-items:center;justify-content:center;}
.opt-lbl{flex:1;line-height:1.45;}
.opt-chev{color:rgba(255,255,255,.35);font-size:11px;flex-shrink:0;}

.s-no{width:100%;margin-top:4px;padding:13px;border:0;background:none;font-family:inherit;font-size:14.5px;font-weight:400;color:var(--muted);cursor:pointer;border-radius:50px;
  transition:transform .4s var(--ease-out),background .25s;}
.s-no:active{transform:scale(.968);background:rgba(255,255,255,.07);}
.s-no:focus-visible{outline:3px solid rgba(143,164,232,.6);outline-offset:3px;}

/* بارکردن (skeleton) */
.skel b{display:block;border-radius:10px;
  background:linear-gradient(100deg,rgba(255,255,255,.05) 28%,rgba(255,255,255,.12) 45%,rgba(255,255,255,.05) 62%);
  background-size:250% 100%;animation:skel 1.3s ease-in-out infinite;}
@keyframes skel{0%{background-position:200% 0}100%{background-position:-200% 0}}
.sk-ttl{height:20px;width:58%;margin:0 auto 10px;}
.sk-sub{height:12px;width:74%;margin:0 auto 22px;}
.sk-opt{height:64px;width:100%;border-radius:20px;margin-bottom:10px;}
.s-real{display:none;}
.sheet.loaded .skel{display:none;}
.sheet.loaded .s-real{display:block;animation:real .3s var(--ease-out) forwards;}
@keyframes real{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}

body.locked{overflow:hidden;}

@media (prefers-reduced-motion:reduce){
  *,*::after{animation:none!important;transition-duration:.01ms!important;}
  .rise{opacity:1;transform:none;}
}
