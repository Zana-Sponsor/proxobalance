<!doctype html>
<html lang="ku" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#046CFA">
  <title>Proxo Form</title>
  <style>
    :root{--brand:#046CFA;--bg:#f7f9fc;--card:#fff;--text:#151923;--muted:#6e7685;--line:#e9edf3;--danger:#c62828}
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Tahoma,Arial,sans-serif}
    .shell{width:min(100%,620px);margin:0 auto;padding:18px 14px 44px}
    .brand{display:flex;align-items:center;justify-content:center;gap:8px;margin:2px 0 18px;font-weight:800;font-size:20px}
    .brand-dot{width:12px;height:12px;border-radius:50%;background:var(--brand)}
    .card{background:var(--card);border:1px solid var(--line);border-radius:22px;box-shadow:0 10px 32px rgba(20,35,60,.06);overflow:hidden}
    .hero{display:none;aspect-ratio:16/10;background:#eef2f8;overflow:hidden}
    .hero img{display:block;width:100%;height:100%;object-fit:cover}
    .content{padding:22px}
    h1{margin:0 0 8px;font-size:24px;line-height:1.4;font-weight:800}
    .desc{margin:0 0 22px;color:var(--muted);font-size:14px;line-height:1.9;white-space:pre-wrap}
    .field{margin:0 0 16px}
    label{display:block;margin:0 0 7px;font-size:14px;font-weight:700}
    .required{color:var(--danger);margin-inline-start:3px}
    input,textarea,select{width:100%;border:1px solid #dce2ea;border-radius:14px;background:#fff;color:var(--text);font:inherit;font-size:15px;padding:13px 14px;outline:none;transition:.16s border-color,.16s box-shadow}
    input:focus,textarea:focus,select:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(4,108,250,.10)}
    textarea{min-height:110px;resize:vertical}
    button{width:100%;border:0;border-radius:15px;background:var(--brand);color:#fff;font:inherit;font-size:16px;font-weight:800;padding:14px 16px;cursor:pointer}
    button:disabled{opacity:.55;cursor:not-allowed}
    .privacy{margin:14px 2px 0;color:#8a92a0;font-size:12px;line-height:1.7;text-align:center}
    .state{padding:42px 22px;text-align:center}
    .state h2{font-size:21px;margin:10px 0 8px}
    .state p{color:var(--muted);margin:0;line-height:1.8}
    .spinner{width:34px;height:34px;margin:0 auto;border:3px solid #e8edf5;border-top-color:var(--brand);border-radius:50%;animation:spin .8s linear infinite}
    .check{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;margin:0 auto;background:#eaf3ff;color:var(--brand);font-size:28px;font-weight:900}
    .error{color:var(--danger)}
    .hidden{display:none!important}
    @keyframes spin{to{transform:rotate(360deg)}}
    @media (max-width:520px){.shell{padding:10px 10px 28px}.card{border-radius:18px}.content{padding:18px}h1{font-size:21px}}
  </style>
</head>
<body>
  <main class="shell">
    <div class="brand" aria-label="Proxo"><span class="brand-dot"></span><span>Proxo</span></div>

    <section id="loadingState" class="card state" aria-live="polite">
      <div class="spinner" aria-hidden="true"></div>
      <h2>چاوەڕێ بکە</h2>
      <p>فۆڕمەکە بار دەکرێت…</p>
    </section>

    <section id="errorState" class="card state hidden" aria-live="assertive">
      <div class="check error" aria-hidden="true">!</div>
      <h2>فۆڕمەکە بەردەست نییە</h2>
      <p id="errorMessage">تکایە دواتر هەوڵ بدەرەوە.</p>
    </section>

    <section id="formCard" class="card hidden">
      <div id="hero" class="hero"><img id="productImage" alt=""></div>
      <div class="content">
        <h1 id="formTitle"></h1>
        <p id="formDescription" class="desc hidden"></p>
        <form id="leadForm" novalidate>
          <div id="fields"></div>
          <button id="submitButton" type="submit">داواکاری بنێرە</button>
          <p class="privacy">بە ناردنی فۆڕمەکە، زانیارییەکانت تەنها بۆ خاوەنی ئەم داواکارییە تۆمار دەکرێن.</p>
        </form>
      </div>
    </section>

    <section id="successState" class="card state hidden" aria-live="polite">
      <div class="check" aria-hidden="true">✓</div>
      <h2>داواکارییەکەت نێردرا</h2>
      <p>سوپاس. زانیارییەکانت بە سەرکەوتوویی تۆمار کران.</p>
    </section>
  </main>
  <script src="/form.js" defer></script>
</body>
</html>
