<!doctype html>
<html lang="ckb" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>بەڕێوەبردنی باڵانس — Proxo</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#f3f6fb;--card:#fff;--ink:#0f172a;--text:#334155;--muted:#64748b;--line:#e3e8f1;--accent:#0265ff;--accent-soft:#eaf3ff;--ok:#15803d;--ok-soft:#e7f7ee;--bad:#b42318;--bad-soft:#fff1f0;--warn-soft:#fff7e6;--shadow:0 10px 24px -18px rgba(15,23,42,.35)}
@media (prefers-color-scheme:dark){:root{--bg:#0b1220;--card:#131c2e;--ink:#e8eef9;--text:#c3cee2;--muted:#8fa0bc;--line:#24324d;--accent:#3b82ff;--accent-soft:#16294a;--ok:#4ade80;--ok-soft:#10301f;--bad:#ff8a80;--bad-soft:#3a1816;--warn-soft:#33270d;--shadow:none}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.8 system-ui,-apple-system,"Segoe UI",Tahoma,"Noto Naskh Arabic","Noto Sans Arabic",sans-serif;padding-bottom:calc(32px + env(safe-area-inset-bottom))}
.top{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:12px;padding:12px 16px;background:var(--card);border-bottom:1px solid var(--line)}
.top h1{margin:0;font-size:16px;color:var(--ink);font-weight:600}
.top a{margin-inline-start:auto;color:var(--accent);text-decoration:none;font-size:13px}
main[hidden]{display:none}
main{max-width:560px;margin:0 auto;padding:16px;display:grid;gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;box-shadow:var(--shadow);display:grid;gap:12px}
.card h2{margin:0;font-size:14.5px;color:var(--ink);font-weight:600}
label.l{display:block;margin:0 0 4px;color:var(--text);font-size:12.5px}
input,textarea{width:100%;border:1.5px solid var(--line);border-radius:14px;background:var(--card);color:var(--ink);font:inherit;font-size:15px;padding:0 14px;height:48px}
textarea{height:auto;min-height:76px;padding:10px 14px;resize:vertical}
input:focus,textarea:focus{outline:0;border-color:var(--accent);box-shadow:0 0 0 3px rgba(2,101,255,.14)}
.ltr{direction:ltr;text-align:left;unicode-bidi:isolate}
.row{display:flex;gap:10px}
.btn{height:48px;border:0;border-radius:14px;background:var(--accent);color:#fff;font:inherit;font-size:14px;padding:0 18px;cursor:pointer}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.ghost{background:var(--accent-soft);color:var(--accent)}
.btn.full{width:100%}
.res{display:grid;gap:8px}
.res button{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;text-align:start;padding:11px 14px;border:1.5px solid var(--line);border-radius:14px;background:var(--card);color:var(--ink);font:inherit;cursor:pointer}
.res button:active{background:var(--accent-soft)}
.res small{display:block;color:var(--muted);font-size:12px}
.res b{font-weight:600}
.res .bal{color:var(--accent);font-size:13px;white-space:nowrap}
.acct{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px;border-radius:16px;background:var(--accent-soft)}
.acct b{display:block;color:var(--ink);font-size:15px}
.acct small{color:var(--muted);font-size:12px;display:block}
.acct .amt{font-size:20px;font-weight:600;color:var(--accent);white-space:nowrap}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding:4px;border-radius:14px;background:var(--bg)}
.seg button{height:42px;border:0;border-radius:11px;background:transparent;color:var(--muted);font:inherit;font-size:13px;cursor:pointer}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 2px 8px -4px rgba(15,23,42,.4);font-weight:600}
.seg button.on[data-m="add"]{color:var(--ok)}
.seg button.on[data-m="deduct"]{color:var(--bad)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips button{height:34px;padding:0 12px;border:1px solid var(--line);border-radius:999px;background:var(--card);color:var(--text);font:inherit;font-size:12.5px;cursor:pointer;direction:ltr}
.preview{padding:10px 12px;border-radius:12px;background:var(--bg);color:var(--text);font-size:13px}
.preview b{color:var(--ink)}
.preview.bad{background:var(--bad-soft);color:var(--bad)}
.hint{color:var(--muted);font-size:12px;margin:2px 0 0}
.err{padding:10px 12px;border-radius:12px;background:var(--bad-soft);color:var(--bad);font-size:13px}
.hist{display:grid;gap:8px}
.h{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:14px}
.h .t{flex:1;min-width:0}
.h .t b{display:block;color:var(--ink);font-size:13px}
.h .t small{display:block;color:var(--muted);font-size:11.5px;overflow-wrap:anywhere}
.h .a{font-weight:600;direction:ltr;white-space:nowrap}
.h .a.pos{color:var(--ok)}.h .a.neg{color:var(--bad)}
.empty{padding:18px;text-align:center;color:var(--muted)}
.modal{position:fixed;inset:0;z-index:20;display:none;align-items:flex-end;justify-content:center;background:rgba(2,8,23,.5)}
.modal.open{display:flex}
.sheet{width:100%;max-width:560px;background:var(--card);border-radius:24px 24px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));display:grid;gap:12px}
.sheet h3{margin:0;color:var(--ink);font-size:16px}
.sum{display:grid;gap:6px;padding:12px;border-radius:14px;background:var(--bg)}
.sum div{display:flex;justify-content:space-between;gap:10px;font-size:13px}
.sum div span:last-child{color:var(--ink);font-weight:600;text-align:end}
.warn{padding:10px 12px;border-radius:12px;background:var(--warn-soft);color:var(--text);font-size:12.5px}
#toast{position:fixed;inset-inline:16px;bottom:calc(20px + env(safe-area-inset-bottom));z-index:30;display:none;justify-content:center}
#toast span{padding:11px 18px;border-radius:14px;background:#0f172a;color:#fff;font-size:13.5px;box-shadow:0 12px 24px -12px rgba(0,0,0,.5)}
#toast.ok span{background:#166534}#toast.bad span{background:#b42318}
.center{padding:60px 20px;text-align:center;color:var(--muted)}
</style>
</head>
<body>
<header class="top"><h1>بەڕێوەبردنی باڵانس</h1><a href="exchange-admin.html">پانێڵی بەڕێوەبەر</a></header>

<main id="gate"><div class="center" id="gateMsg">دەپشکنرێت...</div></main>

<main id="app" hidden>
  <section class="card">
    <h2>گەڕان بۆ هەژمار</h2>
    <div class="row">
      <input id="q" type="search" placeholder="ناو، ناوی بەکارهێنەر، ئیمەیل یان ژمارەی مۆبایل" autocomplete="off" enterkeyhint="search">
      <button class="btn" id="qBtn" type="button">گەڕان</button>
    </div>
    <div class="res" id="results"></div>
  </section>

  <section class="card" id="acctCard" hidden>
    <div class="acct">
      <div><b id="aName">—</b><small class="ltr" id="aSub">—</small></div>
      <div class="amt ltr" id="aBal">—</div>
    </div>
    <div class="seg" id="seg" role="tablist" aria-label="جۆری کردار">
      <button type="button" class="on" data-m="add">زیادکردنی باڵانس</button>
      <button type="button" data-m="refund">گەڕاندنەوە</button>
      <button type="button" data-m="deduct">کەمکردنەوە</button>
    </div>
    <div>
      <label class="l" for="amt">بڕ (دینار)</label>
      <input id="amt" class="ltr" type="text" inputmode="numeric" autocomplete="off" placeholder="10,000">
      <div class="chips" id="chips" style="margin-top:8px"></div>
    </div>
    <div id="orderBox" hidden>
      <label class="l" for="ord">کۆدی مامەڵە (ئارەزوومەندانە)</label>
      <input id="ord" class="ltr" type="text" autocomplete="off" placeholder="P8R4GZLPU8Y2" maxlength="24">
      <p class="hint">ئەگەر گەڕاندنەوەکە بۆ مامەڵەیەکی دیاریکراوە، کۆدەکەی بنووسە.</p>
    </div>
    <div>
      <label class="l" for="note">هۆکار (پێویستە — بۆ بەکارهێنەر و تۆمارەکان)</label>
      <textarea id="note" maxlength="300" placeholder="بۆ نموونە: گەڕاندنەوەی مامەڵەی سەرنەکەوتوو"></textarea>
    </div>
    <div class="preview" id="preview">—</div>
    <div class="err" id="formErr" hidden></div>
    <button class="btn full" id="goBtn" type="button" disabled>بەردەوام بە</button>
  </section>

  <section class="card" id="histCard" hidden>
    <h2>دوایین جووڵەکانی باڵانسی ئەم هەژمارە</h2>
    <div class="hist" id="hist"></div>
  </section>
</main>

<div class="modal" id="confirm" role="dialog" aria-modal="true" aria-labelledby="cTitle">
  <div class="sheet">
    <h3 id="cTitle">پشتڕاستکردنەوە</h3>
    <div class="sum" id="cSum"></div>
    <div class="warn" id="cWarn"></div>
    <div class="err" id="cErr" hidden></div>
    <div class="row">
      <button class="btn ghost" id="cNo" type="button" style="flex:1">پاشگەزبوونەوە</button>
      <button class="btn" id="cYes" type="button" style="flex:2">پشتڕاستکردنەوە و جێبەجێکردن</button>
    </div>
  </div>
</div>
<div id="toast"><span></span></div>

<script>
(function(){
  var SB_URL=atob('aHR0cHM6Ly9weWN4dXVnb2Jsa3NsdndlYnh1dS5zdXBhYmFzZS5jbw==');
  var SB_KEY=atob('ZXlKaGJHY2lPaUpJVXpJMU5pSXNJblI1Y0NJNklrcFhWQ0o5LmV5SnBjM01pT2lKemRYQmhZbUZ6WlNJc0luSmxaaUk2SW5CNVkzaDFkV2R2WW14cmMyeDJkMlZpZUhWMUlpd2ljbTlzWlNJNkltRnViMjRpTENKcFlYUWlPakUzT0RZeU1UazNPVGtzSW1WNGNDSTZNakV3TVRjNU5UYzVPWDAuVlJSd3hubnVMc19XT1J1VlVPM29YM0NMeHJQdGdHX3Vld0lKYUdyem5fcw==');
  // same project (Exchange) and same stored session as the main site
  var sb=window.supabase.createClient(SB_URL,SB_KEY,{auth:{persistSession:true,autoRefreshToken:true,storageKey:'zex_sb_session'}});
  var $=function(id){return document.getElementById(id)};
  var LABEL={add:'زیادکردنی باڵانس',refund:'گەڕاندنەوەی باڵانس',deduct:'کەمکردنەوەی باڵانس'};
  var KIND={admin_credit:'زیادکردنی باڵانس',admin_refund:'گەڕاندنەوەی باڵانس (بەڕێوەبەر)',admin_debit:'کەمکردنەوەی باڵانس',verified_refund:'گەڕاندنەوەی مامەڵە',shortfall_refund:'گەڕاندنەوەی پاشماوە',order_debit:'بەکارهێنان بۆ مامەڵە',payout_hold:'پارەی ناردن (ڕاگیراو)',payout_cancel:'هەڵوەشاندنەوەی ناردن',payout_paid:'ناردن'};
  var ERR={ADMIN_REQUIRED:'تەنها بەڕێوەبەر دەتوانێت ئەم کردارە بکات.',ACCOUNT_NOT_FOUND:'ئەم هەژمارە نەدۆزرایەوە.',AMOUNT_INVALID:'بڕەکە دەبێت لە ١ بۆ ١٠,٠٠٠,٠٠٠ دینار بێت.',NOTE_REQUIRED:'هۆکار پێویستە و دەبێت لانی کەم ٥ پیت بێت.',ORDER_NOT_FOUND:'ئەم کۆدی مامەڵەیە بۆ ئەم هەژمارە نەدۆزرایەوە.',INSUFFICIENT_BALANCE:'باڵانسی ئەم هەژمارە بەشی ئەم بڕە ناکات.',DAILY_LIMIT_EXCEEDED:'سنووری ڕۆژانەی کردارەکانی باڵانس تەواو بووە (٥٠,٠٠٠,٠٠٠ دینار).',REQUEST_KEY_REUSED:'ئەم کردارە پێشتر تۆمار کراوە. لاپەڕەکە نوێ بکەرەوە.',MODE_INVALID:'جۆری کردار هەڵەیە.',AUTH_REQUIRED:'تکایە دووبارە بچۆ ژوورەوە.'};
  var cur=null, mode='add', pending=null, busy=false;

  function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
  function iqd(n){return Number(n||0).toLocaleString('en-US')+' IQD'}
  function digits(s){return String(s||'').replace(/[٠-٩]/g,function(d){return '٠١٢٣٤٥٦٧٨٩'.indexOf(d)}).replace(/[^0-9]/g,'')}
  function amount(){var v=digits($('amt').value);return v?parseInt(v,10):0}
  function toast(t,k){var el=$('toast');el.className=k||'';el.firstElementChild.textContent=t;el.style.display='flex';clearTimeout(toast._t);toast._t=setTimeout(function(){el.style.display='none'},3200)}
  function errText(e){var m=String((e&&(e.message||e.details))||'');for(var k in ERR){if(m.indexOf(k)>-1)return ERR[k]}return 'کردارەکە سەرنەکەوت. دووبارە هەوڵبدەرەوە.'}
  function when(iso){var d=new Date(iso);if(isNaN(d))return '';var p=function(n){return String(n).padStart(2,'0')};return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+' '+p(d.getHours())+':'+p(d.getMinutes())}
  function uuid(){return (crypto&&crypto.randomUUID)?crypto.randomUUID():'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g,function(c){var r=Math.random()*16|0;return (c==='x'?r:(r&3|8)).toString(16)})}

  async function boot(){
    try{
      var s=await sb.auth.getSession();
      var u=s&&s.data&&s.data.session&&s.data.session.user;
      if(!u){$('gateMsg').innerHTML='پێویستە سەرەتا بچیتە ژوورەوە. <br><a href="/" style="color:var(--accent)">گەڕانەوە بۆ ماڵپەڕ</a>';return}
      var p=await sb.from('ex_profiles').select('is_admin,is_banned').eq('id',u.id).maybeSingle();
      if(!p.data||!p.data.is_admin||p.data.is_banned){$('gateMsg').textContent='تەنها بەڕێوەبەر دەتوانێت ئەم لاپەڕەیە بەکاربهێنێت.';return}
      $('gate').hidden=true;$('app').hidden=false;
    }catch(e){$('gateMsg').textContent='نەتوانرا پەیوەندی بکرێت. دووبارە هەوڵبدەرەوە.'}
  }

  async function search(){
    var q=$('q').value.trim();
    var box=$('results');
    if(q.length<2){box.innerHTML='<div class="empty">لانی کەم ٢ پیت بنووسە.</div>';return}
    box.innerHTML='<div class="empty">دەگەڕێت...</div>';
    var r=await sb.rpc('ex_admin_find_accounts',{p_query:q});
    if(r.error){box.innerHTML='<div class="err">'+esc(errText(r.error))+'</div>';return}
    var rows=r.data||[];
    if(!rows.length){box.innerHTML='<div class="empty">هیچ هەژمارێک نەدۆزرایەوە.</div>';return}
    box.innerHTML=rows.map(function(a,i){
      return '<button type="button" data-i="'+i+'"><span><b>'+esc(a.full_name||'—')+'</b><small class="ltr">@'+esc(a.username||'')+' · '+esc(a.phone||a.email||'')+'</small></span><span class="bal ltr">'+esc(iqd(a.available_iqd))+'</span></button>';
    }).join('');
    box._rows=rows;
  }

  function pick(a){
    cur={id:a.user_id,name:a.full_name,username:a.username,phone:a.phone,email:a.email,bal:Number(a.available_iqd||0)};
    $('results').innerHTML='';
    $('acctCard').hidden=false;$('histCard').hidden=false;
    $('aName').textContent=cur.name||'—';
    $('aSub').textContent='@'+(cur.username||'')+' · '+(cur.phone||cur.email||'');
    $('amt').value='';$('note').value='';$('ord').value='';$('formErr').hidden=true;
    setMode('add');paint();loadHist();
    $('acctCard').scrollIntoView({behavior:'smooth',block:'start'});
  }

  function setMode(m){
    mode=m;
    [].forEach.call($('seg').children,function(b){b.classList.toggle('on',b.dataset.m===m)});
    $('orderBox').hidden=(m!=='refund');
    paint();
  }

  function paint(){
    if(!cur)return;
    $('aBal').textContent=iqd(cur.bal);
    var a=amount(),n=$('note').value.trim();
    var after=mode==='deduct'?cur.bal-a:cur.bal+a;
    var pv=$('preview');pv.className='preview';
    if(!a){pv.textContent='بڕەکە بنووسە بۆ بینینی باڵانسی نوێ.'}
    else if(after<0){pv.className='preview bad';pv.textContent='باڵانسی ئەم هەژمارە بەشی ئەم بڕە ناکات.'}
    else{pv.innerHTML=LABEL[mode]+': <b class="ltr">'+esc(iqd(a))+'</b> — باڵانسی نوێ: <b class="ltr">'+esc(iqd(after))+'</b>'}
    $('goBtn').disabled=busy||!a||after<0||a>10000000||n.length<5;
  }

  async function loadHist(){
    var box=$('hist');box.innerHTML='<div class="empty">بار دەکرێت...</div>';
    var r=await sb.rpc('ex_admin_balance_history',{p_user_id:cur.id,p_limit:15});
    if(r.error){box.innerHTML='<div class="err">'+esc(errText(r.error))+'</div>';return}
    var rows=r.data||[];
    if(!rows.length){box.innerHTML='<div class="empty">هیچ جووڵەیەک نییە.</div>';return}
    box.innerHTML=rows.map(function(x){
      var d=Number(x.delta_iqd||0);
      var sub=[x.order_code?('مامەڵە '+x.order_code):'',x.note||''].filter(Boolean).join(' · ');
      return '<div class="h"><div class="t"><b>'+esc(KIND[x.kind]||x.kind)+'</b>'+(sub?'<small>'+esc(sub)+'</small>':'')+'<small class="ltr">'+esc(when(x.created_at))+'</small></div><div class="a '+(d>=0?'pos':'neg')+'">'+(d>=0?'+':'−')+esc(iqd(Math.abs(d)))+'</div></div>';
    }).join('');
  }

  function openConfirm(){
    var a=amount(),n=$('note').value.trim(),o=$('ord').value.trim().toUpperCase();
    var after=mode==='deduct'?cur.bal-a:cur.bal+a;
    $('cTitle').textContent=LABEL[mode];
    $('cSum').innerHTML='<div><span>هەژمار</span><span>'+esc(cur.name||'')+' <bdi dir="ltr">(@'+esc(cur.username||'')+')</bdi></span></div>'
      +'<div><span>کردار</span><span>'+LABEL[mode]+'</span></div>'
      +'<div><span>بڕ</span><span class="ltr">'+esc(iqd(a))+'</span></div>'
      +'<div><span>باڵانسی ئێستا</span><span class="ltr">'+esc(iqd(cur.bal))+'</span></div>'
      +'<div><span>باڵانسی نوێ</span><span class="ltr">'+esc(iqd(after))+'</span></div>'
      +(mode==='refund'&&o?'<div><span>مامەڵە</span><span class="ltr">'+esc(o)+'</span></div>':'')
      +'<div><span>هۆکار</span><span>'+esc(n)+'</span></div>';
    $('cWarn').textContent=mode==='deduct'
      ?'ئەم بڕە لە باڵانسی بەکارهێنەر کەم دەکرێتەوە و ئاگادارکردنەوەی بۆ دەچێت. تۆمار دەکرێت و ناتوانرێت بسڕدرێتەوە.'
      :'ئەم بڕە دەچێتە سەر باڵانسی بەکارهێنەر و ئاگادارکردنەوەی بۆ دەچێت. تۆمار دەکرێت و ناتوانرێت بسڕدرێتەوە.';
    $('cErr').hidden=true;$('confirm').classList.add('open');
  }

  async function execute(){
    if(busy)return;
    var a=amount(),n=$('note').value.trim(),o=$('ord').value.trim().toUpperCase();
    var sig=[cur.id,mode,a,n,mode==='refund'?o:''].join('|');
    if(!pending||pending.sig!==sig)pending={sig:sig,key:uuid()};      // a retry of the same operation reuses its key → never doubles
    busy=true;$('cYes').disabled=true;$('cYes').textContent='دەسپێدەکات...';$('cErr').hidden=true;
    var r=await sb.rpc('ex_admin_adjust_balance',{p_user_id:cur.id,p_mode:mode,p_amount_iqd:a,p_note:n,p_request_key:pending.key,p_order_code:(mode==='refund'&&o)?o:null});
    busy=false;$('cYes').disabled=false;$('cYes').textContent='پشتڕاستکردنەوە و جێبەجێکردن';
    if(r.error){$('cErr').textContent=errText(r.error);$('cErr').hidden=false;return}
    pending=null;
    var res=r.data||{};
    cur.bal=Number(res.balance_after_iqd!=null?res.balance_after_iqd:cur.bal);
    $('confirm').classList.remove('open');
    $('amt').value='';$('note').value='';$('ord').value='';
    paint();loadHist();
    toast(res.duplicate?'ئەم کردارە پێشتر تۆمار کرابوو':'بە سەرکەوتوویی جێبەجێ کرا — باڵانسی نوێ: '+iqd(cur.bal),'ok');
  }

  $('qBtn').onclick=search;
  $('q').addEventListener('keydown',function(e){if(e.key==='Enter'){e.preventDefault();search()}});
  $('results').addEventListener('click',function(e){var b=e.target.closest('button[data-i]');if(!b)return;pick($('results')._rows[+b.dataset.i])});
  $('seg').addEventListener('click',function(e){var b=e.target.closest('button');if(b)setMode(b.dataset.m)});
  $('amt').addEventListener('input',function(){var v=digits(this.value);this.value=v?parseInt(v,10).toLocaleString('en-US'):'';paint()});
  $('note').addEventListener('input',paint);
  $('chips').innerHTML=[5000,10000,25000,50000,100000].map(function(v){return '<button type="button" data-v="'+v+'">'+v.toLocaleString('en-US')+'</button>'}).join('');
  $('chips').addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;$('amt').value=Number(b.dataset.v).toLocaleString('en-US');paint()});
  $('goBtn').onclick=openConfirm;
  $('cNo').onclick=function(){if(!busy)$('confirm').classList.remove('open')};
  $('cYes').onclick=execute;
  $('confirm').addEventListener('click',function(e){if(e.target===this&&!busy)this.classList.remove('open')});
  boot();
})();
</script>
</body>
</html>
