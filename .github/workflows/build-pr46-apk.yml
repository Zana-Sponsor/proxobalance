name: Build PR46 APK

on:
  push:
    branches:
      - build/pr46-apk-20261023-2118

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: proxo_app
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Get dependencies
        run: flutter pub get

      - name: Restore Gradle wrapper if missing
        run: |
          if [ ! -f android/gradlew ]; then
            (cd android && gradle wrapper --gradle-version 8.14.3)
          fi
          chmod +x android/gradlew

      - name: Configure release signing when available
        env:
          KEYSTORE_BASE64: ${{ secrets.PROXO_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.PROXO_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.PROXO_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.PROXO_KEY_ALIAS }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "No release keystore secret; Android Gradle config will use debug signing for this release APK."
            echo "signing=debug-fallback" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          test -n "$STORE_PASSWORD"
          test -n "$KEY_PASSWORD"
          test -n "$KEY_ALIAS"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > android/app/key.jks
          {
            printf 'storePassword=%s\n' "$STORE_PASSWORD"
            printf 'keyPassword=%s\n' "$KEY_PASSWORD"
            printf 'keyAlias=%s\n' "$KEY_ALIAS"
            printf 'storeFile=key.jks\n'
          } > android/key.properties
          echo "signing=release-keystore" >> "$GITHUB_STEP_SUMMARY"

      - name: Build universal release APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Verify APK
        run: |
          test -s build/app/outputs/flutter-apk/app-release.apk
          sha256sum build/app/outputs/flutter-apk/app-release.apk | tee build/app/outputs/flutter-apk/app-release.apk.sha256
          ls -lh build/app/outputs/flutter-apk/app-release.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: proxo-pr46-release-apk
          path: |
            proxo_app/build/app/outputs/flutter-apk/app-release.apk
            proxo_app/build/app/outputs/flutter-apk/app-release.apk.sha256
          retention-days: 7
          if-no-files-found: error
