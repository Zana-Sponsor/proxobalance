name: Build Biology 12 PDF

on:
  push:
    branches:
      - main
    paths:
      - 'downloads/biology12/.newparts/**'
      - '.github/workflows/build-biology12-pdf.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rebuild PDF
        shell: bash
        run: |
          cat downloads/biology12/.newparts/part*.b64 | base64 -d > downloads/biology12/Biology12_RekarAzad.pdf
          test "$(stat -c%s downloads/biology12/Biology12_RekarAzad.pdf)" -gt 100000

      - name: Commit PDF
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add downloads/biology12/Biology12_RekarAzad.pdf
          if ! git diff --cached --quiet; then
            git commit -m "Build complete Biology 12 PDF"
            git push
          fi
