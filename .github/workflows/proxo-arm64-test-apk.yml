name: Build Proxo ARM64 test APK
on:
  push:
    branches:
      - build/proxo-arm64-test-8c1a353
  workflow_dispatch:
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: proxo_app
    steps:
      - uses: actions/checkout@v4
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - name: Install dependencies
        run: flutter pub get
      - name: Restore missing Gradle wrapper
        run: |
          if [ ! -f android/gradlew ]; then
            (cd android && gradle wrapper --gradle-version 8.14.3)
          fi
          chmod +x android/gradlew
      - name: Build ARM64 Android app (test-only signing)
        run: flutter build apk --release --target-platform android-arm64 --no-tree-shake-icons
      - name: Show APK checksum
        run: sha256sum build/app/outputs/flutter-apk/app-release.apk
      - name: Upload installable ARM64 APK
        uses: actions/upload-artifact@v4
        with:
          name: proxo-arm64-test-apk-8c1a353
          path: proxo_app/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 7
