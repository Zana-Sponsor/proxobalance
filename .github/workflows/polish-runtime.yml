name: Proxo Android polish runtime
on:
  pull_request:
    paths: ['proxo_app/**', 'scripts/run-polish-runtime.py', '.github/workflows/polish-runtime.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: polish-runtime-${{ github.ref }}
  cancel-in-progress: true
jobs:
  android-profile:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      FLUTTER_SUPPRESS_ANALYTICS: 'true'
      DART_SUPPRESS_ANALYTICS: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - name: Prepare profile fixture
        working-directory: proxo_app
        run: |
          flutter pub get
          flutter analyze --no-fatal-infos integration_test/polish_runtime_test.dart test_driver/polish_runtime_driver.dart
          if [ ! -f android/gradlew ]; then
            (cd android && gradle wrapper --gradle-version 8.14.3)
          fi
          chmod +x android/gradlew
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -memory 3072
          script: python3 scripts/run-polish-runtime.py
      - name: Retain measured frames and actual Android screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: proxo-polish-android-runtime
          path: proxo_app/build/polish-runtime
          if-no-files-found: warn
          retention-days: 30
