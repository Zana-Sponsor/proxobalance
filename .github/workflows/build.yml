name: Build AAB

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: proxo_app

    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Get dependencies
        run: flutter pub get

      - name: Restore missing Gradle wrapper
        run: |
          if [ ! -f android/gradlew ]; then
            (cd android && gradle wrapper --gradle-version 8.14.3)
          fi
          chmod +x android/gradlew

      - name: Configure release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.PROXO_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.PROXO_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.PROXO_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.PROXO_KEY_ALIAS }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "Release-signing secrets are not configured; using debug signing."
            exit 0
          fi
          if [ -z "$STORE_PASSWORD" ] || [ -z "$KEY_PASSWORD" ] || [ -z "$KEY_ALIAS" ]; then
            echo "Release-signing secrets are incomplete."
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > android/app/key.jks
          {
            printf 'storePassword=%s\n' "$STORE_PASSWORD"
            printf 'keyPassword=%s\n' "$KEY_PASSWORD"
            printf 'keyAlias=%s\n' "$KEY_ALIAS"
            printf 'storeFile=key.jks\n'
          } > android/key.properties

      - name: Build release AAB
        run: flutter build appbundle --release --no-tree-shake-icons

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: proxo-release-aab
          path: proxo_app/build/app/outputs/bundle/release/app-release.aab
          retention-days: 30
