name: Verify ProxoLink
on:
  push:
    branches: [feat/proxolink-private-renderer-migration]
  pull_request:
    paths: ['api/**', 'proxo_app/**', 'test/**', 'vercel.json', '.github/workflows/proxolink-verify.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: test "$(find api -maxdepth 1 -name '*.js' | wc -l)" -le 12
      - run: node scripts/scan-proxolink-source.mjs
  database:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: isolated-fixture
          POSTGRES_DB: proxo_v6_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: isolated-fixture
      PGDATABASE: proxo_v6_test
      PROXO_V6_DATABASE_URL: postgresql://postgres:isolated-fixture@127.0.0.1:5432/proxo_v6_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci
      - run: psql -v ON_ERROR_STOP=1 -f test/fixtures/proxolink-v5-database.sql
      - name: Verify migration transaction rollback
        run: |
          psql -v ON_ERROR_STOP=1 <<'SQL'
          BEGIN;
          \i proxo_app/supabase/migrations/20261006220119_proxolink_v6_independent_pages.sql
          ROLLBACK;
          DO $$ BEGIN
            IF EXISTS(SELECT 1 FROM information_schema.columns WHERE table_schema='public' AND table_name='proxolink_cards' AND column_name='page_kind') THEN
              RAISE EXCEPTION 'V6 migration rollback did not restore the legacy schema';
            END IF;
          END $$;
          SQL
      - run: psql -v ON_ERROR_STOP=1 -f proxo_app/supabase/migrations/20261006220119_proxolink_v6_independent_pages.sql
      - name: Verify additive migration is rerunnable
        run: psql -v ON_ERROR_STOP=1 -f proxo_app/supabase/migrations/20261006220119_proxolink_v6_independent_pages.sql
      - run: psql -v ON_ERROR_STOP=1 -f test/proxolink-v6-database.sql
      - name: Verify page-management migration transaction and contract
        run: |
          psql -v ON_ERROR_STOP=1 <<'SQL'
          BEGIN;
          \i proxo_app/supabase/migrations/20261008234009_proxolink_page_management_contract.sql
          ROLLBACK;
          DO $$ BEGIN
            IF EXISTS(SELECT 1 FROM pg_trigger WHERE tgname='proxolink_v6_management_guard') THEN
              RAISE EXCEPTION 'management migration rollback failed';
            END IF;
          END $$;
          SQL
          psql -v ON_ERROR_STOP=1 -f proxo_app/supabase/migrations/20261008234009_proxolink_page_management_contract.sql
          psql -v ON_ERROR_STOP=1 -f proxo_app/supabase/migrations/20261008234009_proxolink_page_management_contract.sql
          psql -v ON_ERROR_STOP=1 -f test/proxolink-page-management.sql
      - name: Verify Tools moderation migration rollback, rerun and security
        run: |
          psql -v ON_ERROR_STOP=1 <<'SQL'
          BEGIN;
          \i proxo_app/supabase/migrations/20261009131901_proxolink_tools_moderation.sql
          ROLLBACK;
          DO $$ BEGIN
            IF EXISTS(SELECT 1 FROM information_schema.columns WHERE table_schema='public' AND table_name='proxolink_cards' AND column_name='moderation_status') THEN
              RAISE EXCEPTION 'moderation migration rollback failed';
            END IF;
          END $$;
          SQL
          psql -v ON_ERROR_STOP=1 -f proxo_app/supabase/migrations/20261009131901_proxolink_tools_moderation.sql
          psql -v ON_ERROR_STOP=1 -f proxo_app/supabase/migrations/20261009131901_proxolink_tools_moderation.sql
          psql -v ON_ERROR_STOP=1 -f test/proxolink-tools-moderation.sql
      - run: node scripts/proxolink-v6-database.mjs
      - name: Verify disabled release policy, RLS and update rollback
        run: |
          psql -v ON_ERROR_STOP=1 -f proxo_app/supabase/migrations/20261026000100_app_release_policy.sql
          psql -v ON_ERROR_STOP=1 -f proxo_app/supabase/migrations/20261026000100_app_release_policy.sql
          psql -v ON_ERROR_STOP=1 -f test/sql/app_release_policy.sql
  responsive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: node scripts/proxolink-repaint-contract.mjs
      - run: node scripts/proxolink-v6-responsive.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: proxolink-v6-responsive
          path: verification/v6-responsive/
          retention-days: 7
  flutter:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: proxo_app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Render requested high-DPI footer thumbnails if source bundle is pending
        working-directory: .
        run: |
          npm ci
          if [ "$(node -p "require('./proxo_app/tool/proxolink-thumbnail-manifest.json').thumbnail.width")" -lt 1179 ]; then
            npx playwright install --with-deps chromium
            node proxo_app/tool/generate_proxolink_thumbnails.mjs
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: proxolink-footer-thumbnails
          path: |
            proxo_app/assets/proxolink_thumbnails/*.png
            proxo_app/tool/proxolink-thumbnail-manifest.json
          retention-days: 7
      - run: flutter pub get
      - name: Analyze changed ProxoLink code
        run: flutter analyze --no-fatal-infos lib/widgets/proxo_tab_stack.dart test/proxo_tab_stack_test.dart test/proxo_banner_lifecycle_test.dart lib/widgets/ad_validation_notifications.dart test/ad_notice_deadline_test.dart lib/screens/tools_screen.dart lib/screens/proxolink_create_page_screen.dart lib/widgets/proxo_refresh.dart lib/widgets/proxolink_design_selector.dart lib/screens/proxolink_page_editor.dart lib/screens/proxolink_page_editor_screen.dart lib/screens/proxolink_page_details_screen.dart lib/screens/card_webview_screen.dart lib/screens/proxo_cards_list_screen.dart lib/screens/ad_detail_screen.dart lib/widgets/proxolink_preview.dart lib/widgets/proxolink_page_card.dart lib/services/proxolink_service.dart lib/models/proxo_card.dart lib/models/proxolink_page_type.dart lib/models/proxolink_template_meta.dart lib/controllers/proxo_card_controller.dart lib/controllers/proxolink_pages_controller.dart
      - name: Reproduce banner subscription lifecycle and verify fix
        run: |
          cp lib/widgets/proxo_banner.dart /tmp/proxo-banner-fixed.dart
          trap 'cp /tmp/proxo-banner-fixed.dart lib/widgets/proxo_banner.dart' EXIT
          git fetch --no-tags --depth=1 origin cbf06a5ab540ef927eb1252d7fe83f1bb6449231
          git show cbf06a5ab540ef927eb1252d7fe83f1bb6449231:proxo_app/lib/widgets/proxo_banner.dart > lib/widgets/proxo_banner.dart
          flutter test test/proxo_banner_lifecycle_test.dart --dart-define=PROXO_REPRODUCE_OLD_BANNER=true
          cp /tmp/proxo-banner-fixed.dart lib/widgets/proxo_banner.dart
          flutter test test/proxo_banner_lifecycle_test.dart
      - name: Reproduce unused Home request and verify removal
        run: |
          cp lib/screens/home_screen.dart /tmp/proxo-home-fixed.dart
          cp lib/main.dart /tmp/proxo-main-fixed.dart
          trap 'cp /tmp/proxo-home-fixed.dart lib/screens/home_screen.dart; cp /tmp/proxo-main-fixed.dart lib/main.dart' EXIT
          git show cbf06a5ab540ef927eb1252d7fe83f1bb6449231:proxo_app/lib/main.dart > lib/main.dart
          git show cbf06a5ab540ef927eb1252d7fe83f1bb6449231:proxo_app/lib/screens/home_screen.dart > lib/screens/home_screen.dart
          flutter test test/proxolink_actual_screens_test.dart --plain-name 'Home initialization does not fetch an unused profile name' --dart-define=PROXO_REPRODUCE_OLD_HOME=true
          cp /tmp/proxo-home-fixed.dart lib/screens/home_screen.dart
          cp /tmp/proxo-main-fixed.dart lib/main.dart
          flutter test test/proxolink_actual_screens_test.dart --plain-name 'Home initialization does not fetch an unused profile name'
      - name: Preserve historical notice regression and verify current two-second lifecycle
        run: |
          cp lib/widgets/ad_validation_notifications.dart /tmp/proxo-notice-fixed.dart
          cp test/ad_notice_deadline_test.dart /tmp/proxo-notice-current-test.dart
          trap 'cp /tmp/proxo-notice-fixed.dart lib/widgets/ad_validation_notifications.dart; cp /tmp/proxo-notice-current-test.dart test/ad_notice_deadline_test.dart' EXIT
          git fetch --no-tags --depth=1 origin cc52ca4c26a291677f935ff50cf13dd43cfcd5d5
          git fetch --no-tags --depth=1 origin 2a98e20d33f37fd1b6357a21a8758192806361dd
          git show 2a98e20d33f37fd1b6357a21a8758192806361dd:proxo_app/test/ad_notice_deadline_test.dart > test/ad_notice_deadline_test.dart
          git show cc52ca4c26a291677f935ff50cf13dd43cfcd5d5:proxo_app/lib/widgets/ad_validation_notifications.dart > lib/widgets/ad_validation_notifications.dart
          flutter test test/ad_notice_deadline_test.dart --dart-define=PROXO_REPRODUCE_OLD_NOTICE=true
          cp /tmp/proxo-notice-fixed.dart lib/widgets/ad_validation_notifications.dart
          cp /tmp/proxo-notice-current-test.dart test/ad_notice_deadline_test.dart
          flutter test test/ad_notice_deadline_test.dart
      - run: flutter test test/proxolink_v6_flow_test.dart test/proxolink_flow_test.dart test/proxolink_page_management_test.dart test/proxolink_tools_create_test.dart test/proxolink_actual_screens_test.dart test/ad_repository_test.dart test/ad_creation_flow_test.dart test/ad_submission_test.dart test/text_direction_test.dart test/native_phase_schedule_test.dart test/ad_notice_deadline_test.dart test/proxo_tab_stack_test.dart test/proxo_banner_lifecycle_test.dart
      - name: Verify the complete Flutter behavior and visual suite
        run: >-
          flutter test --reporter expanded
          --dart-define=RECEIPT_PDF_CAPTURE=build/receipt-redesign-evidence/pdf
          --dart-define=RECEIPT_MEASUREMENTS=build/receipt-redesign-evidence/measurements.json
      - name: Verify isolated staging blocks production delivery
        run: >-
          flutter test test/staging_transport_test.dart
          --dart-define=PROXO_BACKEND_MODE=staging
          --dart-define=PROXO_SUPABASE_URL=https://abcdefghijklmnopqrst.supabase.co
          --dart-define=PROXO_SUPABASE_ANON_KEY=sb_publishable_fictionalAcceptanceKey
          --dart-define=PROXO_PUBLIC_BASE_URL=https://proxolink-staging-proxo.vercel.app
      - name: Analyze balanced screens and account-safe navigation
        run: >-
          flutter analyze --no-fatal-infos
          lib/screens/home_screen.dart lib/screens/deposit_screen.dart lib/screens/best_metrics_screen.dart
          lib/widgets/home_quick_actions.dart lib/widgets/home_best_result_card.dart lib/widgets/best_metric_card.dart
          lib/widgets/best_metrics_home_section.dart lib/widgets/best_results_design.dart lib/widgets/result_metrics.dart
          lib/widgets/proxo_sidebar.dart lib/widgets/top_bar.dart lib/widgets/notification_bell.dart
          lib/widgets/proxo_symbol.dart lib/theme/proxo_chrome.dart
          lib/widgets/proxo_app_bar.dart lib/widgets/proxo_notice.dart lib/widgets/proxo_error_stack.dart
          lib/widgets/proxo_error_ui.dart lib/widgets/payments/payment_option.dart lib/widgets/ad_form_components.dart
          lib/services/owner_storage_queue.dart lib/services/proxolink_pending_request.dart lib/services/topup_service.dart
          lib/screens/transaction_detail_screen.dart lib/widgets/receipt/receipt_kit.dart
          lib/widgets/receipt/ad_receipt_card.dart lib/widgets/receipt/tx_history_layout.dart
          lib/services/auth_activity_service.dart lib/services/app_telemetry_service.dart
          test/deposit_screen_test.dart test/navigation_chrome_layout_test.dart test/sidebar_navigation_test.dart
          test/receipt_layout_test.dart test/receipt_pdf_test.dart test/tx_history_layout_test.dart
          test/proxolink_creation_recovery_test.dart test/app_balance_capture_test.dart
          test/adaptive_app_bar_test.dart test/pending_storage_serialization_test.dart
          test/topup_storage_deadline_test.dart test/profile_menu_current_scope_test.dart
          lib/screens/profile_screen.dart lib/screens/ad_screen.dart
          lib/theme/proxo_surface.dart lib/widgets/proxo_empty_state.dart
          lib/widgets/proxo_thumbnail_fallback.dart lib/widgets/result_thumbnail.dart
          lib/config/backend_config.dart lib/main.dart lib/services/notification_service.dart
          test/profile_polish_test.dart test/profile_loading_test.dart test/profile_logout_test.dart
          test/empty_state_ui_test.dart test/featured_thumbnail_test.dart test/backend_config_test.dart
          lib/screens/auth/auth_service.dart lib/widgets/fastpay_checkout_sheet.dart lib/services/ad_submission.dart
          test/staging_transport_test.dart test/actual_screen_backend_boundary_test.dart
          integration_test/polish_runtime_test.dart
          lib/services/app_update_service.dart lib/widgets/app_update_host.dart
          lib/widgets/proxo_png_icon.dart lib/widgets/proxo_home_hero.dart lib/theme/proxo_design_tokens.dart
          test/app_update_service_test.dart test/app_wide_capture_test.dart
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: proxolink-ui-verification
          path: |
            proxo_app/build/ui-verification/*.png
            proxo_app/build/ui-verification/actual-screen-measurements.json
            proxo_app/build/pr44-current-evidence/**
            proxo_app/build/polish-evidence/**
            proxo_app/build/home-balance-evidence/**
            proxo_app/build/receipt-redesign-evidence/**
            docs/app-wide-release-2026-10-26/screenshots/**
          retention-days: 7
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - name: Restore wrapper if missing
        run: |
          if [ ! -f android/gradlew ]; then
            (cd android && gradle wrapper --gradle-version 8.14.3)
          fi
          chmod +x android/gradlew
      - run: flutter build apk --release --no-tree-shake-icons
      - name: Scan release APK for template source
        run: |
          python3 - <<'PY'
          import zipfile
          with zipfile.ZipFile('build/app/outputs/flutter-apk/app-release.apk') as apk:
              assert not any('/assets/styles/' in n for n in apk.namelist()), 'Static template previews were bundled'
              data = b''.join(apk.read(n) for n in apk.namelist())
              for marker in [b'ttq.load', b'{{HANDLERS}}', b'function askConfirm', b'const urlParams = new URLSearchParams(window.location.search)', b'buildCardHtml', b'api.telegram.org/bot']:
                  assert marker not in data, 'Forbidden template/credential marker: ' + marker.decode()
          print('Release APK source-privacy scan passed')
          PY
      - name: Measure thumbnail-only release APK impact
        working-directory: .
        run: python3 scripts/measure-proxolink-thumbnail-apk.py
      - name: Retain installable APK
        uses: actions/upload-artifact@v4
        with:
          name: proxo-release-apk
          path: proxo_app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: proxolink-thumbnail-apk-size
          path: proxo_app/build/ui-verification/thumbnail-apk-size.json
          retention-days: 7
  edge-functions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno check proxo_app/supabase/functions/delete-user/index.ts
      - run: deno check proxo_app/supabase/functions/notify-tool-created/index.ts
