name: Verify ProxoLink
on:
  push:
    branches: [feat/proxolink-private-renderer-migration]
  pull_request:
    paths: ['api/**', 'proxo_app/**', 'test/**', 'vercel.json', '.github/workflows/proxolink-verify.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: test "$(find api -maxdepth 1 -name '*.js' | wc -l)" -le 12
      - run: node scripts/scan-proxolink-source.mjs
  flutter:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: proxo_app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Analyze changed ProxoLink code
        run: flutter analyze --no-fatal-infos lib/screens/tools_screen.dart lib/screens/card_webview_screen.dart lib/screens/proxo_cards_list_screen.dart lib/screens/ad_detail_screen.dart lib/widgets/proxolink_preview.dart lib/services/proxolink_service.dart lib/models/proxo_card.dart lib/models/proxolink_template_meta.dart lib/controllers/proxo_card_controller.dart
      - run: flutter test test/proxolink_flow_test.dart test/ad_repository_test.dart test/ad_creation_flow_test.dart test/ad_submission_test.dart test/text_direction_test.dart
      - uses: actions/upload-artifact@v4
        with:
          name: proxolink-ui-verification
          path: proxo_app/build/ui-verification/*.png
          retention-days: 7
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - name: Restore wrapper if missing
        run: |
          if [ ! -f android/gradlew ]; then
            (cd android && gradle wrapper --gradle-version 8.14.3)
          fi
          chmod +x android/gradlew
      - run: flutter build apk --release --no-tree-shake-icons
      - name: Scan release APK for template source
        run: |
          python3 - <<'PY'
          import zipfile
          with zipfile.ZipFile('build/app/outputs/flutter-apk/app-release.apk') as apk:
              assert not any('/assets/styles/' in n for n in apk.namelist()), 'Static template previews were bundled'
              data = b''.join(apk.read(n) for n in apk.namelist())
              for marker in [b'ttq.load', b'{{HANDLERS}}', b'function askConfirm', b'const urlParams = new URLSearchParams(window.location.search)', b'buildCardHtml', b'api.telegram.org/bot']:
                  assert marker not in data, 'Forbidden template/credential marker: ' + marker.decode()
          print('Release APK source-privacy scan passed')
          PY
  edge-functions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno check proxo_app/supabase/functions/delete-user/index.ts
      - run: deno check proxo_app/supabase/functions/notify-tool-created/index.ts
