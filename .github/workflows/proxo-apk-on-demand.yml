name: Build Proxo Android APK (isolated)

on:
  push:
    branches:
      - build/proxo-apk-20261016
    paths:
      - .github/workflows/proxo-apk-on-demand.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-installable-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: proxo_app
    steps:
      - name: Check out exact application snapshot
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Resolve dependencies
        run: flutter pub get

      - name: Restore Gradle wrapper if absent
        run: |
          if [ ! -f android/gradlew ]; then
            (cd android && gradle wrapper --gradle-version 8.14.3)
          fi
          chmod +x android/gradlew

      - name: Build installable Android APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Verify APK archive and record checksum
        run: |
          set -euo pipefail
          APK=build/app/outputs/flutter-apk/app-release.apk
          test -s "$APK"
          unzip -tqq "$APK"
          sha256sum "$APK" | tee build/app/outputs/flutter-apk/app-release.apk.sha256
          echo "APK built from commit ${GITHUB_SHA}" >> "${GITHUB_STEP_SUMMARY}"
          echo "Signing: Android debug keystore fallback unless a release keystore is explicitly configured. This branch supplies no private signing secrets." >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: proxo-android-apk-20261016
          path: |
            proxo_app/build/app/outputs/flutter-apk/app-release.apk
            proxo_app/build/app/outputs/flutter-apk/app-release.apk.sha256
          if-no-files-found: error
          retention-days: 14
