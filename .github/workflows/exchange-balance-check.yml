name: Exchange Balance Checks

on:
  pull_request:
    paths:
      - 'api/**'
      - 'api-handlers/**'
      - 'assets/js/**'
      - 'assets/css/**'
      - 'index.html'
      - 'exchange-admin*.html'
      - 'vercel.json'
      - 'supabase/migrations/**'
      - 'scripts/**'
      - 'server.js'
      - 'test/**'
      - '.github/workflows/exchange-balance-check.yml'
  push:
    branches:
      - feat/exchange-refund-balance-20261005
      - feat/exchange-admin-refund-capped-rewards-20261005
      - fix/exchange-per-user-balances-20261005
      - fix/exchange-carrier-rewards-send-balance-20261005
  workflow_dispatch:

jobs:
  static-and-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Validate server and browser JavaScript
        run: |
          node --check server.js
          node --check api/dispatch.js
          find api-handlers assets/js -type f -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Build Vercel static output
        run: npm run build
      - name: Run verified API, balance and UI regression tests
        run: >-
          node --test
          test/api-dispatch.test.js
          test/auth-api.test.js
          test/account-deletion.test.js
          test/security-hardening.test.js
          test/reward-removal.test.js
          test/transaction-summary.test.js
          test/exchange-admin-refund.test.js
          test/exchange-design-system.test.js
          test/exchange-proxo-shell.test.js
          test/exchange-pricing.test.js
          test/exchange-account-balances-ui.test.js
          test/exchange-access.test.js
          test/exchange-staff-management.test.js
          test/exchange-statistics-order-codes.test.js
      - name: Verify built customer and admin balance assets
        run: |
          test -f public/index.html
          test -f public/exchange-admin.html
          test -f public/exchange-admin-balance.html
          test -f public/assets/js/exchange-pricing.js
          test -f public/assets/js/receipt-access.js
          test -f public/assets/js/exchange-admin-balance.js
          grep -q 'id="pageBalance" data-route="balance"' public/index.html
          grep -q 'id="gate"' public/exchange-admin-balance.html
          grep -q 'id="app"' public/exchange-admin-balance.html
          grep -q 'exchange-admin-balance.html' public/exchange-admin.html
          echo 'PASS: Vercel customer/admin balance output and assets exist.'
