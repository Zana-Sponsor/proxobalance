name: Exchange Balance Checks
on:
  pull_request:
    paths:
      - 'api/admin.js'
      - 'api/balance.js'
      - 'api/orders.js'
      - 'api/_lib/security.js'
      - 'test/orders-route.test.js'
      - 'test/exchange-order-permissions.sql'
      - 'test/exchange-reward-pricing.test.js'
      - 'test/exchange-admin-rewards-refund.test.js'
      - 'test/exchange-account-balances-ui.test.js'
      - 'test/exchange-send-balance.test.js'
      - 'test/exchange-statistics-order-codes.test.js'
      - 'test/exchange-send-balance.browser.mjs'
      - 'test/exchange-scoped-rewards.sql'
      - 'test/exchange-balance-source.sql'
      - 'test/exchange-admin-refund-reward-cap.sql'
      - 'assets/js/**'
      - 'assets/css/exchange-balance.css'
      - 'index.html'
      - 'exchange-admin.html'
      - 'scripts/prepare-vercel.mjs'
      - 'SUPABASE_EXCHANGE_*.sql'
      - '.github/workflows/exchange-balance-check.yml'
  push:
    branches: [feat/exchange-refund-balance-20261005, feat/exchange-admin-refund-capped-rewards-20261005, fix/exchange-per-user-balances-20261005, fix/exchange-carrier-rewards-send-balance-20261005]
jobs:
  static-and-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate server and browser JavaScript
        run: |
          node --check server.js
          node --check api/admin.js
          node --check api/balance.js
          node --check assets/js/admin.js
          node --check assets/js/app.js
          node --check assets/js/exchange-balance.js
          node --check assets/js/exchange-balance-admin.js
          node --check assets/js/exchange-reward-pricing.js
          node --check assets/js/exchange-insights.js
      - name: Build Vercel static output
        run: node scripts/prepare-vercel.mjs
      - name: Verify authenticated orders, admin refunds and capped fee rewards
        run: node --test test/orders-route.test.js test/exchange-reward-pricing.test.js test/exchange-admin-rewards-refund.test.js test/exchange-account-balances-ui.test.js test/exchange-send-balance.test.js test/exchange-statistics-order-codes.test.js
      - name: Verify deployed asset and board paths
        run: |
          node --input-type=module -e "
            import { existsSync,readFileSync } from 'node:fs';
            const check = (value,message) => { if(!value)throw new Error(message); };
            for(const file of ['public/index.html','public/exchange-admin.html',
              'public/assets/js/exchange-balance.js',
              'public/assets/js/exchange-balance-admin.js',
              'public/assets/js/exchange-reward-pricing.js',
              'public/assets/css/exchange-balance.css','api/balance.js'])
              check(existsSync(file),'Missing '+file);
            check(readFileSync('public/index.html','utf8').includes('id=\"balanceSendSection\"'),
              'Missing customer send balance');
            check(readFileSync('public/exchange-admin.html','utf8').includes('id=\"pgBalance\"'),
              'Missing admin balance board');
            console.log('PASS: Exchange customer/admin build and balance assets');
          "
