name: Exchange Production Smoke
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  verify-live-release:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Wait for the current customer and admin bundles to finish deploying
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            if curl -fLsS --max-time 15 'https://www.proxobalance.app/' -o current-index.html &&
               grep -q 'app.js?v=109' current-index.html &&
               grep -q 'receipt-access.js?v=1' current-index.html &&
               grep -q 'auth-phone.css?v=2' current-index.html &&
               grep -q 'auth-otp.css?v=1' current-index.html &&
               grep -q 'site-pause.js?v=5' current-index.html &&
               grep -q 'banners.js?v=2' current-index.html &&
               grep -q 'profile-head.css?v=1' current-index.html &&
               curl -fLsS --max-time 15 'https://www.proxobalance.app/exchange-admin' -o current-admin.html &&
               grep -q 'admin.js?v=42' current-admin.html &&
               grep -q 'admin-details.css?v=1' current-admin.html &&
               grep -q 'exchange-whatsapp-admin.js?v=5' current-admin.html; then
              exit 0
            fi
            sleep 6
          done
          echo 'FAIL: the v61 customer and admin assets were not published within the deployment window.'
          exit 1
      - name: Verify the live customer page and admin panel
        shell: bash
        run: |
          set -euo pipefail
          root="https://www.proxobalance.app"
          curl -fLsS --retry 5 --retry-all-errors --retry-delay 4 --max-time 25 "$root/" -o index.html
          grep -q 'id="appSplash"' index.html
          grep -q 'id="signupPhone"' index.html
          grep -q 'id="authRemember"' index.html
          grep -q 'id="authPhone"' index.html
          grep -q 'id="authTabEmail"' index.html
          grep -q 'id="otpResendBtn" onclick="resendOtp()" hidden' index.html
          grep -q 'id="pageAccountName" data-route="account-name"' index.html
          grep -q 'id="pageChangePhone" data-route="change-phone"' index.html
          grep -q 'id="pageChangePassword" data-route="change-password"' index.html
          grep -q 'id="pageChangeEmail" data-route="change-email"' index.html
          grep -q '/assets/css/account-settings.css?v=6' index.html
          grep -q '/assets/css/account-delete.css?v=4' index.html
          grep -q '/assets/css/kyc-screen.css?v=3' index.html
          grep -q '/assets/js/activity-tracker.js?v=1' index.html
          grep -q '/assets/js/whatsapp-notify.js?v=2' index.html
          grep -q '/assets/css/profile-screens.css?v=2' index.html
          grep -q 'id="pageDash"' index.html
          grep -q 'id="dbNewOrder"' index.html
          grep -q 'id="pageDeleteAccount" data-route="delete-account"' index.html
          grep -q 'id="feedbackSheet"' index.html
          grep -q 'id="pageSummary" data-route="summary"' index.html
          grep -q '/assets/js/exchange-pricing.js?v=1' index.html
          for bad in 'id="pfPhone"' 'id="waPhone"' 'id="signupEmail"' 'id="welcomeReward"' 'id="rewardBanner"' 'id="bdDiscountRow"' 'pxn-fab' 'exchange-reward-pricing'; do
            if grep -q "$bad" index.html; then echo "FAIL: $bad is still published."; exit 1; fi
          done
          curl -fLsS --max-time 25 "$root/assets/js/app.js?v=109" -o app.js
          grep -q 'function submitAccountDeletion' app.js
          grep -q "pxAuthApi('login_start'" app.js
          grep -q "pxAuthApi('phone_change_start'" app.js
          grep -q "pxAuthApi('password_change'" app.js
          grep -q "pxAuthApi('email_change_start'" app.js
          grep -q 'چۆن بوو ئەم مامەڵەیە؟' app.js
          if grep -Eq 'FEEDBACK_REWARD|loadMyRewards|ProxoRewardPricing|#/balance|WALLET_VISUALS|FALLBACK_RATES|N8N_WEBHOOK|requestOtp' app.js; then
            echo 'FAIL: removed code is still in the customer bundle.'; exit 1
          fi
          curl -fLsS --max-time 25 "$root/assets/js/receipt-access.js?v=1" -o receipt-access.js
          grep -q 'createSignedUrl' receipt-access.js
          for route in /home /exchange /transactions /changes /rules /profile /support /verify /balance /delete-account /account-name /change-phone /change-email /change-password /signup /login; do
            curl -fLsS --max-time 20 "$root$route" -o route.html
            grep -q 'id="mainApp"' route.html
          done
          curl -fLsS --retry 5 --retry-all-errors --retry-delay 4 --max-time 25 "$root/exchange-admin" -o exchange-admin.html
          grep -q 'receipt-access.js?v=1' exchange-admin.html
          grep -q 'exchange-staff.js?v=12' exchange-admin.html
          grep -q 'admin-lists.css?v=1' exchange-admin.html
          grep -q 'exchange-site-pause-admin.js?v=4' exchange-admin.html
          grep -q 'exchange-fee-tiers.js?v=1' exchange-admin.html
          grep -q 'id="pgPause"' exchange-admin.html
          grep -q 'id="pgBanners"' exchange-admin.html
          grep -q 'exchange-whatsapp-admin.js?v=5' exchange-admin.html
          grep -q 'ژمارە پشتڕاستکراوەکانی کڕیار' exchange-admin.html
          if grep -q 'firebasejs' route.html; then echo 'FAIL: the customer page still loads Firebase.'; exit 1; fi
          if grep -q 'id="pgRewards"' exchange-admin.html; then echo 'FAIL: the rewards admin page is still published.'; exit 1; fi
          if grep -q 'id="pgOtp"' exchange-admin.html; then echo 'FAIL: the OTP admin page is still published.'; exit 1; fi
          echo "PASS: customer app and verified-number WhatsApp admin panel are live."
      - name: Verify APIs refuse anonymous callers and leak nothing
        shell: bash
        run: |
          set -euo pipefail
          root="https://www.proxobalance.app"
          code() { curl -sS -L --max-time 25 -o /dev/null -w '%{http_code}' "$@"; }
          [ "$(code "$root/api/balance")" = "401" ] || { echo 'FAIL: /api/balance without sign-in'; exit 1; }
          [ "$(code -H 'Content-Type: application/json' --data '{"action":"account_balances","payload":{"user_ids":[]}}' "$root/api/admin")" = "401" ] || { echo 'FAIL: /api/admin without sign-in'; exit 1; }
          [ "$(code -H 'Content-Type: application/json' --data '{"action":"approve_order","payload":{}}' "$root/api/admin")" = "401" ] || { echo 'FAIL: approval without sign-in'; exit 1; }
          [ "$(code "$root/api/auth")" = "405" ] || { echo 'FAIL: /api/auth should only accept POST'; exit 1; }
          [ "$(code -H 'Content-Type: application/json' --data '{"action":"verify_password","password":"x"}' "$root/api/auth")" = "401" ] || { echo 'FAIL: verify_password without sign-in'; exit 1; }
          [ "$(code -H 'Content-Type: application/json' --data '{"action":"login_start","identifier":"+15551234567","password":"x"}' "$root/api/auth")" = "400" ] || { echo 'FAIL: non-Iraqi number accepted'; exit 1; }
          curl -fLsS --max-time 25 "$root/api/public" -o public.json
          if grep -Eq '"phone"|order_code|"id":"P' public.json; then echo 'FAIL: /api/public leaks order codes or phones'; exit 1; fi
          echo "PASS: APIs require sign-in and the public feed carries no personal data."
