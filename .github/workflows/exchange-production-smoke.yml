name: Exchange Production Smoke
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  verify-live-release:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Wait for the current customer and admin bundles to finish deploying
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 24); do
            if curl -fLsS --max-time 15 'https://www.proxobalance.app/' -o current-index.html &&
               grep -q 'app.js?v=46' current-index.html &&
               grep -q 'exchange-customer-polish.css?v=2' current-index.html &&
               curl -fLsS --max-time 15 'https://www.proxobalance.app/exchange-admin' -o current-admin.html &&
               grep -q 'assets/js/admin.js?v=24' current-admin.html &&
               grep -q 'assets/js/exchange-insights.js?v=3' current-admin.html &&
               curl -fLsS --max-time 15 'https://www.proxobalance.app/assets/js/exchange-insights.js?v=3' -o current-insights.js &&
               grep -q 'id,order_code,order_number' current-insights.js &&
               curl -fLsS --max-time 15 'https://www.proxobalance.app/assets/js/app.js?v=46' -o current-app.js &&
               grep -q 'accountBalanceSourceOption' current-app.js &&
               curl -fLsS --max-time 15 'https://www.proxobalance.app/assets/js/exchange-balance.js?v=4' -o current-balance.js &&
               grep -q 'openAccountBalanceSend' current-balance.js; then
              exit 0
            fi
            sleep 5
          done
          echo 'FAIL: current admin bundle was not published within the deployment window.'
          exit 1
      - name: Verify the live customer page, admin panel and bundled assets
        shell: bash
        run: |
          set -euo pipefail
          root="https://www.proxobalance.app"
          curl -fLsS --retry 5 --retry-all-errors --retry-delay 4 --max-time 25 "$root/" -o index.html
          grep -q 'id="balanceSendSection"' index.html
          grep -q 'id="rewardBanner"' index.html
          grep -q 'id="welcomeReward"' index.html
          if grep -q 'id="txSummary"' index.html; then
            echo 'FAIL: completed transactions summary is still published.'
            exit 1
          fi
          grep -q 'app.js?v=46' index.html
          grep -q 'exchange-customer-polish.css?v=2' index.html
          curl -fLsS --max-time 25 "$root/assets/css/exchange-customer-polish.css?v=2" -o customer-polish.css
          grep -q 'tx-card-content' customer-polish.css
          grep -q 'id="recipientSheet"' index.html
          grep -q 'id="savedRecipientsShortcut"' index.html
          grep -q 'exchange-customer-features.js?v=3' index.html
          grep -q '/assets/js/exchange-balance.js' index.html
          grep -q '/assets/js/exchange-reward-pricing.js?v=2' index.html
          curl -fLsS --retry 5 --retry-all-errors --retry-delay 4 --max-time 25 "$root/exchange-admin" -o exchange-admin.html
          grep -q 'id="pgBalance"' exchange-admin.html
          grep -q 'id="pgRewards"' exchange-admin.html
          grep -q 'id="rewardAmountCap"' exchange-admin.html
          grep -q 'id="rewardScope"' exchange-admin.html
          grep -q 'id="walletBadge"' exchange-admin.html
          grep -q 'id="moStaffPermissions"' exchange-admin.html
          grep -q 'id="staffDirectoryButton"' exchange-admin.html
          grep -q 'ڕەتکردنەوە و گەڕاندنەوە بۆ باڵانس' exchange-admin.html
          grep -q 'exchange-balance-admin.js?v=4' exchange-admin.html
          grep -q 'admin.js?v=24' exchange-admin.html
          grep -q 'exchange-insights.js?v=3' exchange-admin.html
          curl -fLsS --retry 5 --retry-all-errors --retry-delay 4 --max-time 25 "$root/assets/js/admin.js?v=24" -o admin.js
          grep -q 'accountBalanceCell' admin.js
          grep -q 'accountBalanceDetails' admin.js
          grep -q "'account_balances'" admin.js
          curl -fLsS --retry 5 --retry-all-errors --retry-delay 4 --max-time 25 "$root/assets/js/exchange-balance.js?v=4" -o exchange-balance.js
          grep -q 'requestBalancePayout' exchange-balance.js
          grep -q 'refreshVisibleBalance' exchange-balance.js
          curl -fLsS --retry 5 --retry-all-errors --retry-delay 4 --max-time 25 "$root/assets/js/exchange-balance-admin.js?v=4" -o exchange-balance-admin.js
          grep -q 'creditVerifiedRefund' exchange-balance-admin.js
          grep -q 'startBalancePayout' exchange-balance-admin.js
          grep -q 'abortProcessingPayout' exchange-balance-admin.js
          curl -fLsS --retry 5 --retry-all-errors --retry-delay 4 --max-time 25 "$root/assets/js/exchange-reward-pricing.js?v=2" -o exchange-reward-pricing.js
          grep -q 'ProxoRewardPricing' exchange-reward-pricing.js
          grep -q 'routeScope' exchange-reward-pricing.js
          curl -fLsS --max-time 25 "$root/assets/js/exchange-customer-features.js?v=3" -o customer-features.js
          grep -q 'observeWalletBadges' customer-features.js
          grep -q 'saveRecipient' customer-features.js
          grep -q 'ex_refresh_reward_alerts' customer-features.js
          curl -fLsS --max-time 25 "$root/assets/js/exchange-staff.js?v=6" -o staff.js
          grep -q 'staffPageAllowed' staff.js
          grep -q 'staffDirectoryAction' staff.js
          grep -q 'staffPasswordAllowed' staff.js
          curl -fLsS --max-time 25 "$root/assets/js/exchange-live.js?v=1" -o live.js
          grep -q 'postgres_changes' live.js
          grep -q 'ex_staff_save_wallet' admin.js
          grep -q 'startCustomerLive' customer-features.js
          echo "PASS: customer balance and reward UI, admin refund and reward UI, and both balance modules are live."
      - name: Verify app authentication and IP block release
        shell: bash
        run: |
          set -euo pipefail
          root="https://www.proxobalance.app"
          grep -q 'exchange-auth-app.css?v=1' index.html
          grep -q 'id="myMonthlyActivity"' exchange-admin.html
          grep -q 'data-wallet-tab="routes"' exchange-admin.html
          curl -fLsS --max-time 25 "$root/ip-blocked.html" -o blocked.html
          grep -q 'ئایپی ئامێرەکەت بلۆک کراوە' blocked.html
          curl -fLsS --max-time 25 "$root/api/track" -o access.json
          grep -q '"ok":true' access.json
      - name: Verify unauthorized clients cannot read balances
        shell: bash
        run: |
          set -euo pipefail
          http="$(curl -sS -L --max-time 25 -o balance-response.json -w '%{http_code}' 'https://www.proxobalance.app/api/balance')"
          if [ "$http" != "401" ]; then
            echo "FAIL: unauthenticated balance API returned HTTP $http; expected 401"
            exit 1
          fi
          grep -q 'Unauthorized' balance-response.json
          echo "PASS: balance API requires authentication (HTTP 401)."
          http="$(curl -sS -L --max-time 25 -o account-response.json -w '%{http_code}' -H 'Content-Type: application/json' --data '{"action":"account_balances","payload":{"user_ids":[]}}' 'https://www.proxobalance.app/api/admin')"
          if [ "$http" != "401" ]; then
            echo "FAIL: unauthenticated per-user balance lookup returned HTTP $http; expected 401"
            exit 1
          fi
          echo "PASS: per-user admin balance lookup requires authentication (HTTP 401)."
