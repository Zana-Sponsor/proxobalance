name: proxo_app
description: Proxo — TikTok Ad Manager for Kurdistan & Iraq
publish_to: 'none'
version: 1.0.9+9

environment:
  # ⚠ بوو '>=3.3.0'. solar_iconkit داوای Dart >= 3.6.0 (Flutter >= 3.27)
  #   دەکات، بۆیە خوارترین سنوور بەرز کرایەوە. ئەگەر Flutterەکەت
  #   کۆنترە، `flutter upgrade` بکە پێش `flutter pub get`.
  sdk: '>=3.6.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  pinput: ^4.0.0
  # ── UI & Icons
  font_awesome_flutter: ^11.0.0  # 10.x extends IconData, which is final since Flutter 3.44
  flutter_svg: ^2.0.10+1
  # ⚠ دوو پاکێزی Solar لێرەن و تێکەڵ نین:
  #
  #   solar_icons   → تەنها Bold / Broken / **Outline**. هیچ Linearێکی نییە.
  #                   (ئەگەر هیچ شاشەیەکی تر بەکاری نەهێنێت، بیسڕەوە.)
  #   solar_iconkit → هەر شەش ستایلەکە، **Linear** ستایلی بنەڕەتییە.
  #                   SVGە، نەک فۆنت — بۆیە هەرگیز وەک ▯ دەرناکەوێت.
  #                   `ad_detail_screen.dart` ئەمە بەکاردەهێنێت.
  #
  # flutter_svg بە شێوەی لاوەکی دێت، بۆیە ڕاگەیاندنی زیادە ناوێت.
  solar_icons: 0.1.0
  solar_iconkit: ^1.2.0
  # ── Backend: Supabase
  supabase_flutter: 2.5.0
  http: ^1.2.1
  # Tutorial downloads use path_provider directly.
  path_provider: ^2.1.3
  # ── Backend: Firebase
  firebase_core: ^3.3.0
  firebase_database: ^11.1.0
  firebase_messaging: ^15.0.3
  flutter_local_notifications: ^17.2.2
  url_launcher: ^6.3.0
  # Secure in-app previews load only signed HTTPS server-rendered pages.
  webview_flutter: ^4.10.0
  image_picker: ^1.2.3
  cached_network_image: ^3.3.1
  flutter_cache_manager: ^3.3.1
  device_info_plus: ^10.1.0
  # ANDROID_ID for trusted-device recovery. device_info_plus deliberately does
  # NOT expose this: its AndroidDeviceInfo.id is the OS BUILD number, identical
  # on every handset running the same firmware, so using it would treat every
  # such device as the same one.
  android_id: ^0.4.0
  # sha256, so the raw hardware identifier is hashed on device and never
  # transmitted or stored.
  crypto: ^3.0.3
  permission_handler: ^11.3.1
  shared_preferences: ^2.3.2
  connectivity_plus: ^6.0.3
  pdf: ^3.10.0
  printing: ^5.12.0
  share_plus: ^10.1.2
  shimmer: ^3.0.0

dependency_overrides:
  app_links: 3.5.1

dev_dependencies:
  integration_test:
    sdk: flutter
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  generate: true
  uses-material-design: true
  assets:
    # proxo_logo.png is the centred wordmark in ProxoTopBar. This directory
    # was NOT declared before, so any Image.asset from it threw at runtime.
    - assets/proxolink_thumbnails/
    - assets/images/
    - assets/icons/
    - assets/icons/ad_card/
    - assets/icons/nav/
    - assets/icons/home/
    - assets/icons/detail/
    - assets/fonts/
    - assets/logos/fib.jpg
    - assets/logos/fastpay.jpg
    - assets/logos/fastpay_logo.png
    - assets/logos/qicard.jpg
    - assets/logos/proxo_logo_white.png
    - assets/logos/proxo_notification_logo.png
    - assets/logos/tiktok_icon.png
  fonts:
    # User-selected Rabar_021 at normal Flutter weight. The bundled font
    # itself is Bold; this registration does not alter its glyph outlines.
    - family: ProxoReceipt
      fonts:
        - asset: assets/fonts/Rabar_021.ttf
          weight: 400
    # Existing application font registration.
    - family: Rabar
      fonts:
        - asset: assets/fonts/Rabar_021.ttf
          weight: 400
        # - asset: assets/fonts/Rabar-Medium.ttf
        #   weight: 500
        # - asset: assets/fonts/Rabar-Bold.ttf
        #   weight: 700
