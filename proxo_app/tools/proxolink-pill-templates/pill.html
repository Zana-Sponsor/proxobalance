*{box-sizing:border-box}html,body{margin:0;min-width:0}body{background:var(--page);color:var(--ink);font-weight:400;line-height:1.5;-webkit-tap-highlight-color:transparent}button,a{font-family:inherit}button{font-weight:400}a{color:inherit}img,svg{display:block}button,a,input{touch-action:manipulation}button{cursor:pointer}button:focus-visible,a:focus-visible{outline:3px solid var(--accent);outline-offset:4px}button:disabled{cursor:default}
.wrap{position:relative;isolation:isolate;max-width:430px;width:100%;min-height:100vh;min-height:100svh;margin-inline:auto;background:var(--surface);display:flex;flex-direction:column;overflow-wrap:anywhere;padding-top:max(24px,env(safe-area-inset-top));padding-bottom:env(safe-area-inset-bottom)}
.aura{position:absolute;inset:0 0 auto;height:300px;background:radial-gradient(ellipse at top,var(--aura),transparent 72%);pointer-events:none;z-index:-1}
.av-wrap{display:flex;justify-content:center;padding-top:40px;margin-bottom:18px}.av{width:88px;height:88px;border:4px solid var(--card);border-radius:50%;overflow:hidden;background:linear-gradient(150deg,#8B5CF6,#6D28D9);display:grid;place-items:center;color:#FFFFFF;box-shadow:0 10px 26px -10px rgba(var(--shadow),.25),0 0 0 6px var(--ring)}.av img{width:100%;height:100%;object-fit:cover}.initials{font-size:1.875rem;line-height:1}
.profile{padding-inline:var(--gutter);margin-bottom:26px;text-align:center}.uname{font-size:1.25rem;font-weight:400;line-height:1.5;margin:0 0 8px;unicode-bidi:plaintext}.ubio{font-size:.875rem;font-weight:400;line-height:1.8;color:var(--muted);margin:0 auto;max-width:290px;white-space:pre-line;unicode-bidi:plaintext}
.btns{margin-inline:var(--gutter);padding:var(--pad);background:var(--card);border-radius:34px;box-shadow:0 14px 34px -16px rgba(var(--shadow),.22),0 2px 8px rgba(var(--shadow),.04)}.section+.section{margin-top:22px;padding-top:22px;border-top:1px solid var(--line)}.section-title{font-size:.875rem;font-weight:400;line-height:1.5;color:var(--muted);margin:0 0 12px;text-align:center}.list{display:flex;flex-direction:column;gap:12px}
.pl-btn{display:flex;align-items:center;justify-content:center;gap:0;width:100%;min-width:0;min-height:56px;padding:14px 18px;border:0;border-radius:50px;color:var(--fg);background-color:var(--bg);background-image:var(--gradient);text-decoration:none;position:relative;box-shadow:inset 0 1px 0 rgba(255,255,255,.20),0 6px 14px -8px rgba(var(--glow),.36);transition:transform .25s var(--ease),box-shadow .25s var(--ease)}.pl-btn:active{transform:scale(.975)}.pl-lbl{flex:1;min-width:0;font-size:1rem;font-weight:400;line-height:1.5;text-align:center;overflow-wrap:anywhere;unicode-bidi:plaintext}.pl-ic,.pl-sp{width:36px;flex:0 0 36px}.pl-ic{display:flex;align-items:center;justify-content:center}.pl-ic svg,.pl-ic img{width:24px;height:24px;flex:0 0 24px;object-fit:contain}.pl-sp{align-self:stretch}
.pl-btn[data-provider="whatsapp"]{margin-block-start:2.25rem}.wa-message-card{position:absolute;inset-block-end:calc(100% + 8px);inset-inline-end:14px;max-width:calc(100% - 28px);padding:.25rem .625rem;border:1px solid #159951;border-radius:12px;background-color:#25D366;background-image:linear-gradient(135deg,#46E98B,#25D366 52%,#1EC362);color:#10231A;font-size:.75rem;font-weight:400;line-height:1.5;text-align:center;white-space:normal;overflow-wrap:anywhere;box-shadow:0 5px 12px rgba(16,35,26,.12);animation:wa-message-in .5s var(--ease) both,wa-message-float 1.7s ease-in-out .5s 2}.wa-message-card::after{content:"";position:absolute;inset-block-end:-5px;inset-inline-end:16px;width:8px;height:8px;background:#1EC362;border-inline-end:1px solid #159951;border-block-end:1px solid #159951;transform:rotate(45deg);border-end-end-radius:2px}@keyframes wa-message-in{from{opacity:0;transform:translateY(6px) scale(.96)}to{opacity:1;transform:translateY(0) scale(1)}}@keyframes wa-message-float{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}

  try{const u=new URL(s),n=u.searchParams.get('number');if(u.hostname!=='chat'||u.pathname||u.hash||[...u.searchParams.keys()].some(k=>k!=='number')||!/^\+?[1-9]\d{6,14}$/.test(n||''))return null;return 'viber://chat?number='+encodeURIComponent(n);}catch{return null;}
 }
 try{const u=new URL(s);if(u.protocol!=='https:'||u.username||u.password||(u.port&&u.port!=='443'))return null;
  const host=u.hostname.toLowerCase();if(!p.hosts.some(h=>host===h||host.endsWith('.'+h)))return null;
  if(id==='app_store'&&!/\/id\d+/.test(u.pathname))return null;
  if(id==='google_play'&&(!/^\/store\/apps\/details\/?$/.test(u.pathname)||!u.searchParams.get('id')))return null;
  return u.href;
 }catch{return null;}
}
function safeImage(value){if(typeof value==='string'&&/^\/(?:contact\/[0-9a-f-]{36}|a\/[A-Za-z0-9_-]{20,128})\/avatar(?:\?preview_token=[A-Za-z0-9_.%_-]+)?$/.test(value))return value;try{const u=new URL(value);return u.protocol==='https:'&&!u.username&&!u.password?u.href:null;}catch{return null;}}
function toast(text){const n=$('toast');n.textContent=text;n.hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>n.hidden=true,3000);}
function navigate(button,url){
 const fallback=safeUrl(button.type,button.fallbackUrl)||null;
 const detail={type:'openExternal',provider:button.type,url,fallbackUrl:fallback};
 const event=new CustomEvent('proxo:navigate',{detail,cancelable:true});if(!window.dispatchEvent(event))return;
 const bridge=window.ProxoLinkNavigation;if(bridge&&typeof bridge.postMessage==='function'){bridge.postMessage(JSON.stringify(detail));return;}
 location.assign(url);
}
function closeDialog(){const d=$('intent-dialog');if(typeof d.close==='function')d.close();else d.removeAttribute('open');document.body.style.overflow='';if(opener&&opener.isConnected)opener.focus({preventScroll:true});pending=null;}
function openDialog(button,url,node){
 opener=node;pending={button,url};const box=$('intent-options');box.replaceChildren();
 for(const intent of current.intents.slice(0,6)){
  const b=el('button','opt');b.type='button';b.append(el('span','opt-icon',String(intent.emoji||'').slice(0,8)),el('span','opt-label',String(intent.label||'').slice(0,150)));
  b.addEventListener('click',()=>{let msg=String(intent.message||'').slice(0,2000);if(current.videoUrl){try{const v=new URL(current.videoUrl);if(v.protocol==='https:'&&(v.hostname==='www.tiktok.com'||v.hostname==='tiktok.com'))msg=v.href+'\n\n'+msg;}catch{}}
   const u=new URL(url);u.searchParams.set('text',msg);const item=pending;closeDialog();navigate(item.button,u.href);});box.append(b);
 }
 const d=$('intent-dialog');if(typeof d.showModal==='function')d.showModal();else{d.classList.add('legacy-dialog');d.setAttribute('open','');}
 document.body.style.overflow='hidden';box.querySelector('button')?.focus();
}
function activate(button,url,node,event){
 if(current.preview){event.preventDefault();toast('ئەمە نموونەی پەڕەکەیە.');return;}
 if(!url){event.preventDefault();return;}
 if(button.type==='whatsapp'&&button.intents===true&&Array.isArray(current.intents)&&current.intents.length){event.preventDefault();openDialog(button,url,node);return;}
 if(window.ProxoLinkNavigation||window.__PROXO_INTERCEPT_NAVIGATION__){event.preventDefault();navigate(button,url);}
}
function render(config){
 if($('intent-dialog').open)closeDialog();current=JSON.parse(JSON.stringify(config||{}));
 const theme=themes.includes(current.template)?current.template:document.documentElement.dataset.theme;document.documentElement.dataset.theme=themes.includes(theme)?theme:'pill-white';
 const meta=document.querySelector('meta[name="theme-color"]');meta.content=getComputedStyle(document.documentElement).getPropertyValue('--page').trim();
 document.documentElement.dir=current.direction==='ltr'?'ltr':'rtl';document.documentElement.lang=current.lang==='en'?'en':current.lang==='ar'?'ar':'ku';
 const name=String(current.name||'ProxoLink').slice(0,180);$('name').textContent=name;$('bio').textContent=String(current.bio||'').slice(0,2000);document.title=name+' | ProxoLink';
 const avatar=$('avatar');avatar.replaceChildren();const fallback=()=>{avatar.replaceChildren(el('span','initials',Array.from(name.trim())[0]||'P'));};fallback();
 const image=safeImage(current.avatarUrl);if(image){const img=el('img');img.src=image;img.alt=name;img.width=88;img.height=88;img.decoding='async';img.addEventListener('error',fallback,{once:true});avatar.replaceChildren(img);}
 const holder=$('buttons');holder.replaceChildren();const groups={contact:[],order:[],download:[]};const seen=new Set();
 const buttons=Array.isArray(current.buttons)?current.buttons.slice(0,30):[];
 for(const b of buttons){if(!b||b.enabled===false||!byId[b.type])continue;const url=safeUrl(b.type,b.url);if(!url&&!current.preview)continue;
  const p=byId[b.type];if((p.group==='download')&&seen.has(b.type))continue;seen.add(b.type);groups[p.group].push({b,p,url});}
 for(const [group,items]of Object.entries(groups)){if(!items.length)continue;const section=el('section','section');const heading=el('h2','section-title',current.lang==='en'?({contact:'Contact',order:'Order',download:'Get the app'})[group]:current.lang==='ar'?({contact:'تواصل معنا',order:'اطلب الآن',download:'تنزيل التطبيق'})[group]:labels[group]);section.append(heading);
  const list=el('div',group==='download'?'store-list':'list');
  if(group==='download')items.sort((a,b)=>a.b.type==='app_store'?-1:b.b.type==='app_store'?1:0);
  for(const {b,p,url}of items){const node=el('a',group==='download'?'store-link '+b.type:'pl-btn rise');node.href=url||'#';node.dataset.provider=b.type;node.setAttribute('aria-label',String(b.label||p.label).slice(0,150));node.style.setProperty('--bg',p.bg);node.style.setProperty('--gradient',p.gradient);node.style.setProperty('--fg',p.fg);node.style.setProperty('--glow',p.glow);
   if(group==='download'){const img=el('img');img.src=BADGES[b.type];img.alt=p.name==='App Store'?'Download on the App Store':'Get it on Google Play';img.decoding='async';img.addEventListener('error',()=>node.replaceChildren(el('span','store-fallback',p.name)),{once:true});node.append(img);}
   else{const icon=el('span','pl-ic');icon.innerHTML=ICONS[p.icon]||ICONS.bag;node.append(el('span','pl-sp'),el('span','pl-lbl',String(b.label||p.label).slice(0,150)),icon);}
   if(b.type==='whatsapp'){const message=el('span','wa-message-card','پەیوەندی بکە');message.dir='rtl';message.setAttribute('aria-hidden','true');node.append(message);}
   node.addEventListener('click',event=>activate(b,url,node,event));list.append(node);
  }section.append(list);holder.append(section);
 }
 if(!holder.children.length)holder.append(el('p','empty',current.lang==='en'?'No links available.':'هیچ لینکێک بەردەست نییە.'));
 const tt=$('tiktok'),ttBox=$('tiktok-wrap');let ttUrl=null;try{const u=new URL(current.tiktokUrl);if(u.protocol==='https:'&&['www.tiktok.com','tiktok.com'].includes(u.hostname))ttUrl=u.href;}catch{}
 ttBox.hidden=!ttUrl;if(ttUrl){tt.href=ttUrl;tt.textContent=String(current.tiktokLabel||'TikTok').slice(0,100);tt.onclick=e=>{if(current.preview){e.preventDefault();toast('ئەمە نموونەی پەڕەکەیە.');}else if(window.ProxoLinkNavigation||window.__PROXO_INTERCEPT_NAVIGATION__){e.preventDefault();navigate({type:'tiktok'},ttUrl);}};}
}
$('cancel').addEventListener('click',closeDialog);$('intent-dialog').addEventListener('cancel',()=>{document.body.style.overflow='';pending=null;});
$('intent-dialog').addEventListener('click',e=>{const r=e.currentTarget.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)closeDialog();});
$('intent-dialog').addEventListener('keydown',e=>{if(e.key==='Escape'){e.preventDefault();closeDialog();}if(e.key==='Tab'){const nodes=[...e.currentTarget.querySelectorAll('button')];const first=nodes[0],last=nodes[nodes.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}}});
window.ProxoLink=Object.freeze({setConfig:render,getConfig:()=>JSON.parse(JSON.stringify(current)),validateUrl:safeUrl,catalog:CATALOG.map(p=>({...p})),version:'pill-templates-1.1.0'});
try{render(JSON.parse($('proxo-config').textContent));}catch{render({template:document.documentElement.dataset.theme,name:'ProxoLink',buttons:[]});}
})();
</script></body></html>
