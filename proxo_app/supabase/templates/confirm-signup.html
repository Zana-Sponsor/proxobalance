<!doctype html>
<html lang="ckb" dir="rtl">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"></head>
<body style="margin:0;background:#f8fafc;font-family:Arial,sans-serif;color:#0f172a">
  <main style="max-width:440px;margin:32px auto;padding:28px;background:#fff;border:1px solid #e2e8f0;border-radius:12px">
    <p dir="ltr" style="color:#046cfa;font-size:24px;margin:0 0 24px">Proxo</p>
    <h1 style="font-size:20px;font-weight:400">پشتڕاستکردنەوەی ئیمەیڵ</h1>
    <p style="font-size:14px;line-height:1.8">بۆ تەواوکردنی هەژمارەکەت، ئەم کۆدە لە ئەپی پرۆکسۆ بنووسە.</p>
    <p dir="ltr" style="text-align:center;letter-spacing:8px;font-size:32px;color:#0759ce;background:#edf4ff;padding:18px;border-radius:12px">{{ .Token }}</p>
    <p lang="ar" style="font-size:14px;line-height:1.8">أدخل هذا الرمز في تطبيق Proxo لتأكيد بريدك الإلكتروني.</p>
    <p lang="en" dir="ltr" style="font-size:14px;line-height:1.8">Enter this code in Proxo to verify your email. If you did not request an account, ignore this email.</p>
  </main>
</body>
</html>
